version: '3.8'

services:
  # 1. Policy Signer Init Container
  policy-init:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/sign-policy"]
    command:
      - "-output"
      - "/shared/policy.json"
      - "-session-budget"
      - "100000"
      - "-max-per-tx"
      - "10000"
      - "-node-address"
      - "node-1:50051"
    volumes:
      - shared-data:/shared

  # 2. Validator Node 1 (Genesis / Authority)
  node-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ID=3000
    command: ["node", "startnode", "--api-addr", ":8081", "--grpc-port", ":50051"]
    ports:
      - "3000:3000"
      - "50051:50051"
      - "8081:8081"
    volumes:
      - node1-data:/app
    networks:
      - p2p-mesh

  # 3. Peer Node 2
  node-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ID=3001
    command: ["node", "startnode", "--api-addr", ":8082", "--grpc-port", ":50052"]
    ports:
      - "3001:3001"
      - "50052:50052"
      - "8082:8082"
    depends_on:
      - node-1
    volumes:
      - node2-data:/app
    networks:
      - p2p-mesh

  # 4. Peer Node 3
  node-3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ID=3002
    command: ["node", "startnode", "--api-addr", ":8083", "--grpc-port", ":50053"]
    ports:
      - "3002:3002"
      - "50053:50053"
      - "8083:8083"
    depends_on:
      - node-1
    volumes:
      - node3-data:/app
    networks:
      - p2p-mesh

  # 5. Indexer & Real-time Web Dashboard
  indexer-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/indexer"]
    command:
      - "-node-address"
      - "node-1:50051"
      - "-http-port"
      - ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - node-1
    networks:
      - p2p-mesh

networks:
  p2p-mesh:
    driver: bridge

volumes:
  shared-data:
  node1-data:
  node2-data:
  node3-data:
