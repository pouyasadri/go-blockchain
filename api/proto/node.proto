syntax = "proto3";

package proto;

option go_package = "github.com/pouyasadri/go-blockchain/api/proto";

service NodeService {
  rpc SubmitTransaction (SubmitTransactionRequest) returns (SubmitTransactionResponse);
  rpc StreamNewBlocks (StreamBlocksRequest) returns (stream BlockEvent);
  rpc MintStableBalance (MintRequest) returns (MintResponse);
  rpc GetUTXOs (UTXORequest) returns (UTXOResponse);
  rpc GetBlockByHash (BlockByHashRequest) returns (BlockResponse);
  rpc GetBestHeight (HeightRequest) returns (HeightResponse);
  rpc GetBalance (BalanceRequest) returns (BalanceResponse);
}

message SubmitTransactionRequest {
  ProtoTransaction transaction = 1;
}

message SubmitTransactionResponse {
  bool success = 1;
  string tx_id = 2;
  string error = 3;
}

message StreamBlocksRequest {
  int64 start_height = 1;
}

message BlockEvent {
  ProtoBlock block = 1;
}

message MintRequest {
  string address = 1;
  int64 amount = 2;
}

message MintResponse {
  bool success = 1;
  string tx_id = 2;
  string error = 3;
}

message ProtoTransaction {
  bytes id = 1;
  repeated ProtoTXInput vin = 2;
  repeated ProtoTXOutput vout = 3;
}

message ProtoTXInput {
  bytes txid = 1;
  int32 vout = 2;
  bytes signature = 3;
  bytes pub_key = 4;
  bytes escrow_witness = 5;
  bool is_refund = 6;
}

message ProtoTXOutput {
  int64 value = 1;
  bytes pub_key_hash = 2;
  uint32 script_type = 3;
  bytes data_hash_lock = 4;
  int64 timeout_block = 5;
  bytes buyer_pub_key_hash = 6;
}

message ProtoBlock {
  int64 timestamp = 1;
  repeated ProtoTransaction transactions = 2;
  bytes prev_block_hash = 3;
  bytes hash = 4;
  int32 nonce = 5;
  int32 height = 6;
  int32 bits = 7;
  bytes authority_signature = 8;
  bytes authority_pub_key = 9;
}

message UTXORequest {
  string address = 1;
}

message UTXOOutputItem {
  bytes txid = 1;
  int32 vout = 2;
  int64 value = 3;
  bytes pub_key_hash = 4;
  uint32 script_type = 5;
  bytes data_hash_lock = 6;
  int64 timeout_block = 7;
  bytes buyer_pub_key_hash = 8;
}

message UTXOResponse {
  repeated UTXOOutputItem utxos = 1;
}

message BlockByHashRequest {
  bytes hash = 1;
}

message BlockResponse {
  ProtoBlock block = 1;
  bool found = 2;
}

message HeightRequest {}

message HeightResponse {
  int32 height = 1;
}

message BalanceRequest {
  string address = 1;
}

message BalanceResponse {
  int64 balance = 1;
}
